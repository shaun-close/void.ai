[package]
name = "void-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes = "1.12.2"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
directories = "6.0.0"
futures-util = "0.3.34"
globset = "0.4.21"
hex = "0.4.3"
ignore = "0.4.34"
regex = "1.13.2"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
similar = "3.2.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "process", "time", "sync", "net", "io-util"] }
tokio-util = "0.7.20"
toml = "1.2.2"
uuid = { version = "1.29.3", features = ["v7", "serde"] }
xattr = "1.7.0"

[dev-dependencies]
tempfile = "3.27.0"
