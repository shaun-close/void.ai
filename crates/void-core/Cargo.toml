[package]
name = "void-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "process", "time", "sync", "net", "io-util"] }
toml = "1.2.2"
uuid = { version = "1.29.3", features = ["v7", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
