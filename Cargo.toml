[workspace]
members = [
    "crates/void-core",
    "crates/void-editor",
    "crates/void-sandbox",
    "crates/void-vim",
    "apps/void-gui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shaun-close/void.ai"

[workspace.dependencies]
void-core = { path = "crates/void-core" }
void-editor = { path = "crates/void-editor" }
void-vim = { path = "crates/void-vim" }
ropey = { version = "1.6", default-features = false, features = ["simd"] }
