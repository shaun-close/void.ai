[package]
name = "void-gui"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "void-ai"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11", "persistence"] }
egui = "0.37"
egui_commonmark = { version = "0.26", features = ["better_syntax_highlighting"] }
egui_dock = { version = "0.22", features = ["serde"] }
rfd = "0.18.0"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
ropey.workspace = true
void-core.workspace = true
void-editor.workspace = true
void-vim.workspace = true
trash = "5.4.0"
ignore = "0.4.34"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "snapshot", "wgpu"] }
futures-util = "0.3.34"
tempfile = "3.27.0"
