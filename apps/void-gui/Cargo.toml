[package]
name = "void-gui"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "void-ai"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11", "persistence"] }
egui = "0.37"
egui_dock = { version = "0.22", features = ["serde"] }
rfd = "0.18.0"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
void-core.workspace = true
